<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Ho Wei Lun — Data Science & AI Engineer. Personal site featuring projects, experience, and more.">
    <title>Ho Wei Lun | Data Science & AI</title>
    <link rel="stylesheet" href="style.css?v=2.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Particle Canvas Background -->
    <canvas id="canvas"></canvas>

    <!-- Sticky Navbar -->
    <nav id="navbar">
        <div class="nav-inner">
            <a class="nav-logo" href="#hero">WL</a>
            <button class="nav-hamburger" id="nav-hamburger" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links" id="nav-links">
                <li><a href="#about" class="nav-link" data-section="about">About</a></li>
                <li><a href="#skills" class="nav-link" data-section="skills">Skills</a></li>
                <li><a href="#projects" class="nav-link" data-section="projects">Projects</a></li>
                <li><a href="#experience" class="nav-link" data-section="experience">Experience</a></li>
                <li><a href="#education" class="nav-link" data-section="education">Education</a></li>
                <li><a href="#hackathons" class="nav-link" data-section="hackathons">Hackathons</a></li>
                <li><a href="#contact" class="nav-link nav-link-cta" data-section="contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Page Sections (rendered by sections/*.js) -->
    <main class="content-wrapper">
        <section id="hero" class="site-section hero-section"></section>
        <section id="about" class="site-section glass-card"></section>
        <section id="skills" class="site-section glass-card"></section>
        <section id="projects" class="site-section glass-card"></section>
        <section id="experience" class="site-section glass-card"></section>
        <section id="education" class="site-section glass-card"></section>
        <section id="hackathons" class="site-section glass-card"></section>
        <section id="contact" class="site-section glass-card contact-card"></section>
    </main>

    <!-- Data Files (order matters — loaded before sections) -->
    <script src="data/projects.js"></script>
    <script src="data/hackathons.js"></script>
    <script src="data/skills.js"></script>
    <script src="data/experience.js"></script>
    <script src="data/education.js"></script>
    <!-- Section Renderers -->
    <script src="sections/hero.js"></script>
    <script src="sections/about.js"></script>
    <script src="sections/skills.js"></script>
    <script src="sections/projects.js"></script>
    <script src="sections/experience.js"></script>
    <script src="sections/education.js"></script>
    <script src="sections/hackathons.js"></script>
    <script src="sections/contact.js"></script>

    <!-- Main Script (canvas + nav + scroll) -->
    <script src="script.js?v=2.2"></script>
</body>

</html>
